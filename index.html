<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="googlebot" content="noindex,nofollow">
<title>國中數學課堂教材</title>
<style>
:root{
  --primary:#cc785c;--primary-active:#a9583e;--ink:#141413;--body:#3d3d3a;--muted:#6c6a64;
  --hair:#e6dfd8;--canvas:#faf9f5;--card:#efe9de;--dark:#181715;--on-dark:#faf9f5;
  --serif:"Iowan Old Style","Palatino Linotype","Noto Serif TC","Songti TC",Georgia,serif;
  --sans:Inter,"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--canvas);font:16px/1.65 var(--sans);color:var(--ink)}
.w{max-width:1080px;margin:0 auto;padding:72px 28px}
.eyebrow{margin:0 0 12px;color:var(--primary);font-size:13px;font-weight:600;letter-spacing:.14em}
h1{margin:0;font:400 clamp(42px,6vw,68px)/1.08 var(--serif);letter-spacing:-.035em}
p.sub{max-width:720px;margin:18px 0 40px;color:var(--body);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.c{display:flex;min-height:210px;flex-direction:column;justify-content:space-between;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:28px;text-decoration:none;color:inherit}
.c:hover{outline:2px solid color-mix(in srgb,var(--primary) 36%,transparent);outline-offset:2px}
.c small{color:var(--primary);font-size:12px;font-weight:600;letter-spacing:.12em}
.c b{display:block;margin:8px 0 10px;font:400 28px/1.2 var(--serif);letter-spacing:-.02em}
.c span{color:var(--body);font-size:14px}
.go{margin-top:24px;color:var(--ink);font-size:14px;font-weight:600}
footer{margin-top:42px;padding-top:20px;border-top:1px solid var(--hair);font-size:13px;color:var(--muted)}
@media(max-width:820px){.w{padding:44px 20px}.grid{grid-template-columns:1fr}.c{min-height:160px}}
</style>
</head>
<body>
<div class="w">
  <p class="eyebrow">CLASSROOM MATH DECKS</p>
  <h1>國中數學課堂教材</h1>
  <p class="sub">課堂投影用的互動教材。重點、題目與解答以投影可讀性優先；支援目錄跳轉、畫筆、雷射筆與全螢幕講解。</p>
  <div class="grid">
    <a class="c" href="math-8A-textbook/"><div><small>八年級上學期</small><b>課本版</b><span>檢討隨堂練習、習作與評量</span></div><div class="go">開啟教材 →</div></a>
    <a class="c" href="math-8A-indicator/"><div><small>八年級上學期</small><b>指標版</b><span>依教學指標編排的課堂教材</span></div><div class="go">開啟教材 →</div></a>
    <a class="c" href="math-9A-indicator/"><div><small>九年級上學期</small><b>指標版</b><span>相似形、圓、推理證明與三角形的心</span></div><div class="go">開啟教材 →</div></a>
  </div>
  <footer>教師自製教材，課堂使用。公式排版使用隨站封裝的 MathJax。</footer>
</div>
</body>
</html>
